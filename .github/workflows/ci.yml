name: Module 5 CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  assurance:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: gradcafe
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d gradcafe"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      PGHOST: localhost
      PGPORT: "5432"
      PGDATABASE: gradcafe
      PGUSER: postgres
      PGPASSWORD: postgres
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/gradcafe
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/gradcafe

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: module_5/requirements.txt

      - name: Install Graphviz
        run: sudo apt-get update && sudo apt-get install -y graphviz

      - name: Install Python dependencies
        working-directory: module_5
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install -e .
          python -m pip check

      - name: Pylint 10 out of 10
        working-directory: module_5
        env:
          PYTHONPATH: src
        run: pylint --fail-under=10 src/*.py

      - name: Generate dependency graph
        working-directory: module_5
        run: |
          cd src
          pydeps app.py --noshow -T svg -o ../dependency.svg
          cd ..
          test -s dependency.svg

      - name: Set up Snyk
        uses: snyk/actions/setup@master

      - name: Snyk dependency scan
        working-directory: module_5
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: snyk test --file=requirements.txt --command=python

      - name: Run pytest
        working-directory: module_5
        shell: bash
        run: |
          set -o pipefail
          python -m pytest -q 2>&1 | tee coverage_summary.txt

      - name: Upload Module 5 artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: module-5-assurance-artifacts
          path: |
            module_5/dependency.svg
            module_5/coverage_summary.txt
