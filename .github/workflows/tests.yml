name: Module 4 Tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: gradcafe
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d gradcafe"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      PGHOST: localhost
      PGPORT: "5432"
      PGDATABASE: gradcafe
      PGUSER: postgres
      PGPASSWORD: postgres
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/gradcafe
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/gradcafe

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: module_4/requirements.txt

      - name: Install dependencies
        run: python -m pip install -r module_4/requirements.txt

      - name: Run marked test suite with 100 percent coverage
        shell: bash
        run: |
          set -o pipefail
          python -m pytest module_4/tests -m "web or buttons or analysis or db or integration" -q 2>&1 | tee module_4/coverage_summary.txt

      - name: Upload coverage summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: module-4-coverage-summary
          path: module_4/coverage_summary.txt
