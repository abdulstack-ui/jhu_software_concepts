<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Abdul Sarwar{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

<nav>
    <div class="nav-links">
        <a href="{{ url_for('pages.home') }}"
           class="{% if request.endpoint == 'pages.home' %}active{% endif %}">
            Home
        </a>

        <a href="{{ url_for('pages.projects') }}"
           class="{% if request.endpoint == 'pages.projects' %}active{% endif %}">
            Projects
        </a>

        <a href="{{ url_for('pages.contact') }}"
           class="{% if request.endpoint == 'pages.contact' %}active{% endif %}">
            Contact
        </a>
    </div>
</nav>

<main>
    {% block content %}{% endblock %}
</main>

</body>
</html>
